[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local3d"
version = "0.1.0"
description = "Local-first 3D asset generation for agents on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<14",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3,<4"]

[project.scripts]
local3d = "local3d.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
extend-exclude = [".cache", "models", "outputs"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: requires a local Blender executable"]
